# Harness configuration. Environment variables in ${VAR} form are expanded.

auth:
  # Claude runs on your Claude plan login, GPT-6 Astra on your ChatGPT plan (via Codex).
  # API keys are stripped and the harness refuses to start on API billing.
  subscription_only: true

models:
  main: claude-opus-5-5          # orchestrator
  advisor: claude-fable-5-1      # second opinion, used when stuck
  coder: claude-fable-5-1        # all coding work
  designer: claude-opus-5-5      # UI and visual design
  worker: claude-sonnet-5-5      # scraping, research, general tasks
  triage: claude-sonnet-5-5      # summarize / compress scraped content (upgraded from Haiku)
  video: claude-opus-5-5
  verifier: claude-fable-5-1     # checks worker output before it is accepted
  gui: gpt-6-astra               # runs through Codex CLI on your ChatGPT subscription
  image: gpt-6.1-sol             # image generation, editing and analysis (via Codex)
  image_fallback: gpt-6-astra
  # GPT models you can pick at the top of a tab (ChatGPT subscription, via Codex)
  gpt: [gpt-6-astra, gpt-6.1-sol]
  # Claude models offered in each tab's picker. Leave empty to offer everything your plan has.
  claude: []
  # Fallback chain (item 10): tried in order if the primary is overloaded/unavailable
  fallback: [claude-opus-5-5, claude-sonnet-5-5]

effort:
  main: high
  advisor: xhigh
  coder: xhigh
  worker: medium
  verifier: high

advisor:
  # Like Claude Code: the working model consults the advisor model (above) on its
  # own whenever it hits something hard. Uses the server-side advisor tool.
  auto: true

limits:
  # When the Claude plan's usage limit is reached, continue the task on GPT
  # (ChatGPT plan) and send new tabs there until the limit resets.
  fallback_to_gpt: true
  warn_at: 0.8   # show a heads-up when a usage window passes 80%
  refresh_minutes: 5   # re-read plan usage this often (0 = only at start and when you open Usage)

context:
  # When a chat's context window passes this share, write a hand-off summary
  # (context.md) and offer to continue in a new chat that starts from it.
  # 0 turns it off; /handoff does it any time.
  handoff_at: 0.8

# Also escalate to the advisor subagent after this many consecutive tool failures
stuck_after_failures: 3

verify:
  enabled: true
  max_rounds: 2                  # how many times the verifier can send work back

approvals:
  # Only GitHub pushes need human approval. Everything else runs automatically.
  github_push: ask
  # Pushing to these branches is refused outright (your "never push to main" rule)
  protected_branches: [main, master]

sandbox:
  enabled: true                  # sandbox Bash (bubblewrap on Linux, Seatbelt on macOS)
  fail_if_unavailable: false

memory:
  # Viewers shown in the sidebar. The first address that answers is used.
  claude_mem: [http://localhost:37701, http://localhost:37777]
  hindsight: [http://localhost:9999, http://localhost:8888]
  # Where the agents reach Hindsight's memory tools (HINDSIGHT_MCP_URL in .env overrides it)
  hindsight_mcp: http://localhost:8888/mcp/

# Your own subagents, made with /subagents (or edit the file by hand)
subagents_file: ./subagents.yaml

design_library: ./design-library/UI-LINKS.md   # Markdown, YAML or a plain URL list

plugins_dir: ./vendor/plugins    # superpowers, claude-mem (installed by scripts/setup.sh)

chats_dir: ./.harness/chats

mcp:
  github: true
  slack: true
  outlook: true
  hindsight: true
  firecrawl: true
  exa: true
  context7: true
  playwright: true
