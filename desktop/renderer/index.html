<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: file:; frame-src http://localhost:* http://127.0.0.1:*; connect-src 'none'"
    />
    <title>Multi-Agent Harness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="titlebar"><span class="wordmark">Harness</span><button class="awake" id="awakeChip" hidden title="Click to let the computer sleep again"></button></div>
    <div class="app" id="app">
      <!-- sidebar: workspace, library, instruments -->
      <aside class="sidebar">
        <div class="side-top">
          <button class="workspace" id="sbFolder" title="Change the folder the agents work in">
            <span class="ws-label">Workspace</span>
            <span class="ws-name" id="wsName">…</span>
          </button>
          <button class="new-task" id="newTaskBtn" title="New task (⌘T)"><span>New task</span><kbd>⌘T</kbd></button>
        </div>

        <nav class="library" aria-label="Library">
          <button class="seg active" data-pane="chats">Chats</button>
          <button class="seg" data-pane="docs">Docs</button>
          <button class="seg" data-pane="memory">Memory</button>
          <button class="seg" data-pane="connections">Apps<span class="seg-badge" id="connBadge" hidden></span></button>
          <button class="seg" data-pane="team">Team</button>
        </nav>
        <div class="pane-tools">
          <input id="paneSearch" placeholder="Search" />
          <div class="pane-actions" id="paneActions"></div>
        </div>
        <div class="pane-body" id="paneBody"></div>

        <!-- instrument panel -->
        <section class="instruments" aria-label="Status">
          <button class="inst" id="sbContext" title="Context window (/context)"></button>
          <button class="inst" id="sbUsage" title="Claude plan usage (/usage)"></button>
          <button class="inst" id="sbGpt" title="ChatGPT plan"></button>
        </section>
      </aside>

      <!-- main column -->
      <main class="main">
        <div class="tabbar">
          <div class="tabs" id="tabs" role="tablist"></div>
          <button class="tab-add" id="tabAdd" title="New task (⌘T)" aria-label="New task">+</button>
          <button class="tab-add settings" id="statusAct" title="Status & settings" aria-label="Status">⋯</button>
        </div>

        <header class="toolbar" id="toolbar">
          <h1 id="chatTitle" title="Double-click to rename">New task</h1>
          <div class="top-actions">
            <label class="model" title="Model for this tab">
              <span class="mark" id="modelMark"></span>
              <select id="modelSelect"></select>
            </label>
            <button class="switch" id="verifyBtn" title="Fable checks delegated work before you see it"><i></i>Verify</button>
            <button class="text-btn" id="btwBtn" title="Side question (/btw)">btw</button>
            <button class="text-btn" id="forkBtn" title="Fork into a new window (/fork)">fork</button>
          </div>
        </header>

        <div class="views" id="views"></div>

        <footer class="composer-wrap" id="composerWrap">
          <div class="slash-menu" id="slashMenu" role="listbox" hidden></div>
          <div class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Describe the task. / for commands, @ for apps" autofocus></textarea>
            <div class="composer-bar">
              <span class="hint" id="hint"></span>
              <div class="composer-actions">
                <button class="text-btn" id="changeBtn" hidden title="Correct the running task now (⌘Enter)">change now</button>
                <button class="text-btn danger" id="stopBtn" hidden title="Stop">stop</button>
                <button class="send" id="sendBtn" title="Send (Enter)">Send</button>
              </div>
            </div>
          </div>
        </footer>
      </main>

      <aside class="btw-panel" id="btwPanel" hidden>
        <div class="btw-head"><span>By the way</span><button class="icon" id="btwClose" aria-label="Close">×</button></div>
        <p class="btw-sub">Side questions. The task doesn't see these.</p>
        <div class="btw-list" id="btwList"></div>
        <form class="btw-form" id="btwForm"><input id="btwInput" placeholder="Ask on the side…" /></form>
      </aside>
    </div>

    <!-- kept for compatibility with older code paths; hidden -->
    <div hidden><span id="sbModel"></span><span id="sbVerify"></span><span id="sbTasks"></span><span id="crumbFolder"></span></div>

    <div class="modal" id="modal" hidden>
      <div class="modal-card">
        <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon" id="modalClose" aria-label="Close">×</button></div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <div class="blocker" id="blocker" hidden>
      <div class="blocker-card">
        <h2>Sign in with your subscription</h2>
        <p id="blockerMsg"></p>
        <ol>
          <li>Open Claude Code in a terminal: <code>claude</code></li>
          <li>Run <code>/login</code> and choose your Claude Pro or Max account</li>
          <li>Come back and press Retry</li>
        </ol>
        <button class="send" id="retryAuth">Retry</button>
      </div>
    </div>

    <script src="../../node_modules/marked/lib/marked.umd.js"></script>
    <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
