<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: file:; frame-src http://localhost:* http://127.0.0.1:*; connect-src 'none'"
    />
    <title>Agent Harness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="titlebar"><span>Agent Harness</span></div>
    <div class="app" id="app">
      <!-- activity bar (VS Code) -->
      <nav class="activity" aria-label="Views">
        <button class="act active" data-pane="chats" title="Chats">
          <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z" /></svg>
        </button>
        <button class="act" data-pane="docs" title="Documents">
          <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6" /></svg>
        </button>
        <button class="act" data-pane="memory" title="Memory (claude-mem, Hindsight)">
          <svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3" /><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" /></svg>
        </button>
        <button class="act" data-pane="connections" title="MCP servers & apps">
          <svg viewBox="0 0 24 24"><path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5" /></svg>
          <span class="act-badge" id="connBadge" hidden></span>
        </button>
        <button class="act" data-pane="team" title="Team & subagents">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3" /><circle cx="17" cy="9" r="2.3" /><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6M15 14.6c2.6-.3 4.8 1 5.5 3.9" /></svg>
        </button>
        <div class="act-spacer"></div>
        <button class="act" id="statusAct" title="Status & settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></svg>
        </button>
      </nav>

      <!-- sidebar -->
      <aside class="sidebar">
        <div class="pane-head">
          <span id="paneTitle">Chats</span>
          <div class="pane-actions" id="paneActions"></div>
        </div>
        <div class="pane-search"><input id="paneSearch" placeholder="Search" /></div>
        <div class="pane-body" id="paneBody"></div>
      </aside>

      <!-- editor area -->
      <main class="main">
        <div class="tabbar">
          <div class="tabs" id="tabs" role="tablist"></div>
          <button class="tab-add" id="tabAdd" title="New task (⌘T)" aria-label="New task">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>

        <header class="toolbar" id="toolbar">
          <div class="crumbs"><span class="crumb-folder" id="crumbFolder"></span><span class="sep">/</span><h1 id="chatTitle" title="Double-click to rename">New chat</h1></div>
          <div class="top-actions">
            <label class="select" title="Model for this tab">
              <select id="modelSelect"></select>
              <svg viewBox="0 0 24 24" class="chev"><path d="M7 10l5 5 5-5" /></svg>
            </label>
            <button class="btn toggle" id="verifyBtn" title="Fable verifier checks delegated work"><span class="check"></span>Verifier</button>
            <button class="btn" id="btwBtn" title="Side question (/btw)">btw</button>
            <button class="btn" id="forkBtn" title="Fork into a new window (/fork)">Fork</button>
          </div>
        </header>

        <div class="views" id="views"></div>

        <footer class="composer-wrap" id="composerWrap">
          <div class="slash-menu" id="slashMenu" role="listbox" hidden></div>
          <div class="composer" id="composer">
            <textarea id="input" rows="1" placeholder="Ask the team, or type / for commands" autofocus></textarea>
            <div class="composer-bar">
              <span class="hint" id="hint"></span>
              <div class="composer-actions">
                <button class="btn" id="changeBtn" hidden title="Correct the agent now without stopping (⌘Enter)">Change now</button>
                <button class="btn danger" id="stopBtn" hidden title="Stop">Stop</button>
                <button class="btn primary" id="sendBtn" title="Send (Enter)">Send</button>
              </div>
            </div>
          </div>
        </footer>
      </main>

      <aside class="btw-panel" id="btwPanel" hidden>
        <div class="pane-head"><span>By the way</span><button class="icon" id="btwClose" aria-label="Close">×</button></div>
        <p class="btw-sub">Side questions don't touch the chat.</p>
        <div class="btw-list" id="btwList"></div>
        <form class="btw-form" id="btwForm"><input id="btwInput" placeholder="Ask a side question…" /></form>
      </aside>
    </div>

    <!-- status bar (VS Code) -->
    <footer class="statusbar" id="statusbar">
      <div class="sb-left">
        <button class="sb" id="sbFolder" title="Project folder"></button>
        <button class="sb" id="sbModel" title="Model for this tab"></button>
        <button class="sb" id="sbVerify" title="Verifier"></button>
        <span class="sb" id="sbTasks"></span>
      </div>
      <div class="sb-right">
        <button class="sb" id="sbContext" title="Context window (/context)"></button>
        <button class="sb" id="sbUsage" title="Claude plan usage (/usage)"></button>
        <button class="sb" id="sbGpt" title="ChatGPT plan"></button>
      </div>
    </footer>

    <div class="modal" id="modal" hidden>
      <div class="modal-card">
        <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon" id="modalClose" aria-label="Close">×</button></div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <div class="blocker" id="blocker" hidden>
      <div class="blocker-card">
        <h2>Sign in with your subscription</h2>
        <p id="blockerMsg"></p>
        <ol>
          <li>Open Claude Code in a terminal: <code>claude</code></li>
          <li>Run <code>/login</code> and choose your Claude Pro or Max account</li>
          <li>Come back and press Retry</li>
        </ol>
        <button class="btn primary" id="retryAuth">Retry</button>
      </div>
    </div>

    <script src="../../node_modules/marked/lib/marked.umd.js"></script>
    <script src="../../node_modules/dompurify/dist/purify.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
